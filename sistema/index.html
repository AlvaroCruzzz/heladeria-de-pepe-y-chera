<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Heladería - JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍦 Mostrador de Helados</h1>
        <button id="btn-lista">📋 Ver lista de sabores</button>
    </header>

    <main>
        <section class="panel-control">
            <h2>Gestión de Pedidos</h2>
            <button id="btn-ddl">🍨 Servir Dulce de Leche</button>
            <button id="btn-chocolate">🍫 Servir Chocolate</button>
            <button id="btn-frutilla">🍓 Servir Frutilla</button>
            <button id="btn-pistacho">🥜 Servir Pistacho</button>
        </section>

        <section class="barra">
            <h2>Pedidos en el Mostrador</h2>
            <div id="mostrador-helados">
                <p id="obsoleto">🍧 Cucurucho vacío juntando frío</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
